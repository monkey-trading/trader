# An example config for `trader run --config <file>`: one account trading one market with a strategy,
# sized and held to risk limits. Every section refuses keys it does not know. Relative paths are read
# from this file's directory. `scripts/dev-stack.sh` prints the [node] section of a local dev node
# instead.

[node]
# The node's API, https://host:port. OWNER: the production node's address, set at launch.
url = "https://node.monkeytrading.example:443"
# The custody chain and vault every signature names: the node's [custody] chain_id and vault.
# OWNER: the production vault's address, set at launch.
chain_id = 42161
vault = "0x0000000000000000000000000000000000000000"
# How long one call may take, and the longest silence on the stream before it reconnects.
request_timeout = "10s"
stream_timeout = "30s"
# A dev build also takes tls_key_sha256 = "<64 hex>", the node's TLS key hash, for a node whose
# certificate no public CA signs, as a dev node's. Without it the certificate must chain to a public
# root.

# What the node's attestation must prove before the bot trusts it. The enclave address it names
# signs every answer and stream frame, and the TLS key it names is the only one the bot accepts.
[node.attestation]
# An SEV-SNP quote whose certificate chain ends at the vendor's root and which matches one of these
# release manifests, as each engine release publishes them. OWNER: the launch release's manifest.
type = "sev_snp"
releases = ["engine-release.toml"]
# A dev build also takes root = "<file>", a PEM root certificate for a test chain, and
# type = "mock" alone for a dev node's mock attestation, which proves nothing.

[account]
# An encrypted Web3 Secret Storage keystore, as wallets export it, with its password from a file
# (password = { file = "..." }) or an environment variable (password = { env = "..." }).
# A dev build also takes { type = "hex_file", path = "..." }: a file holding the key in hex.
key = { type = "keystore", path = "keys/account.json", password = { env = "TRADER_KEY_PASSWORD" } }
# Whether stopping the bot closes the strategy's position. It always cancels resting orders. A stop
# first waits for the log to pass any order that could still enter it, up to 35 s, then makes a few
# calls of up to request_timeout each, and more while a position too large for one close stays
# open, for up to a minute; give a supervisor's stop a longer grace period.
close_on_stop = false
# Where the bot keeps the day's loss across restarts, so a restart does not hand a stopped account a
# new day. One file per account.
state_dir = "state"

[strategy]
# The market, by symbol: a USD market priced from spot quotes. A market with trading hours is
# traded only while it is open.
market = "BTC-USD"
# Bars of whole minutes, from 1m to 1d, aligned to the Unix epoch.
bar = "1m"
# How far from the quoted mark a market order may fill, in bps.
max_slippage_bps = 25
# The strategy, by kind, each taking its parameters in bars of the length above:
#   sma_crossover        fast, slow: long while the fast average of closes is above the slow one,
#                        short while below
#   ema_crossover        fast, slow: the same with exponential averages
#   macd                 fast, slow, signal (12, 26, 9): long while the MACD line is above its signal
#   rsi_reversion        period, oversold, exit, overbought (14, 30, 50, 70): long when the index
#                        falls to oversold, short when it rises to overbought, flat at exit
#   bollinger_reversion  period, width (20, 2): long on a close below the lower band, short above the
#                        upper, flat at the middle band; width is in standard deviations
#   donchian_breakout    entry, exit (20, 10): long on a close above the last entry closes' highest,
#                        short below their lowest, flat on a close beyond the last exit closes
# Decimal values are strings, such as width = "1.5".
kind = "sma_crossover"
fast = 5
slow = 20

[sizing]
# How large a new position is: by = "fixed_notional" with notional in USD, or by = "equity_fraction"
# with bps of the account's equity. A position on the strategy's side keeps its size.
by = "fixed_notional"
notional = "1000"
# The most leverage the account takes on, as notional over equity. It must be below the market's
# own, which its first margin tier sets.
max_leverage = "5"

[risk]
# The limits hold for the account. The bot trades one market, and refuses an account that holds a
# position in another.
max_open_positions = 1
# The most the positions' notional may add up to, in USD.
max_total_notional = "5000"
# At this loss in a UTC day the account is flattened and stopped until the next day: { usd = "..." },
# or { equity_bps = ... } of the day's opening equity. The loss is the fall in equity, so a withdrawal
# counts as a loss and a deposit hides one.
daily_loss = { usd = "100" }
# No order adds to a position unless equity stays this many bps of the margin requirement above it.
# The engine closes positions when equity falls below half the requirement.
margin_buffer_bps = 10000
# A position is held this long before a strategy closes it. The default, an hour, stands in until the
# engine's holding-time profit fee is set (monkey-trading/engine#614).
min_hold = "1h"

[logging]
level = "info"

# Prometheus metrics at http://<listen>/metrics: orders placed and declined, fills, each account's
# equity and margin level, and the stream's lag. The address must be a loopback one. Leave the
# section out to serve none.
[metrics]
listen = "127.0.0.1:9466"
