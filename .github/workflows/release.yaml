name: Release

# A version tag the owner pushes on a commit of `main` publishes a release: the Dockerfile's
# production variant built natively for linux/amd64 and linux/arm64, the static binaries attached to
# the tag's GitHub release with a SHA256SUMS file, and the image pushed to the GitHub Container
# Registry under the tag, one name for both platforms. A tag runs this file as the tagged commit
# holds it, so the guard that only the owner publishes is the repository's tag ruleset, which lets
# only the owner create, move or delete `v*` tags; `check` below adds that the tag is the crate's
# version, pushed by the owner, on a commit of `main`. No pull request, merge group or branch push
# runs this workflow.
on:
  push:
    tags: ["v*"]

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # The owner pushed the tag, the crate's version, on a commit of `main`.
  check:
    if: github.actor == '0xjevons'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Require the tag's commit on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: Require the tag to be the crate's version
        run: |
          version="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)"
          [[ "$GITHUB_REF_NAME" == "v$version" ]] \
            || { echo "::error::the tag $GITHUB_REF_NAME is not v$version, the version Cargo.toml names"; exit 1; }

  # Each platform's binary, and its image pushed by digest alone; `publish` names them.
  build:
    needs: check
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            file: x86-64
            runner: ubuntu-24.04
          - platform: linux/arm64
            arch: arm64
            file: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Start a builder that can export the binary and push by digest
        # BuildKit v0.34.2, pinned as every other input is.
        run: >-
          docker buildx create --use --driver docker-container
          --driver-opt image=moby/buildkit:v0.34.2@sha256:c5f8862f52499773af85bc07695b2379ef08e8002352b0df2c4864c91d78dabe
      - name: Build the binary
        run: |
          docker buildx build --platform "${{ matrix.platform }}" --build-arg VARIANT=production --target binary \
            --output type=local,dest=out .
          mv out/trader "trader-linux-${{ matrix.arch }}"
          file "trader-linux-${{ matrix.arch }}" | tee /dev/stderr | grep -q "${{ matrix.file }}.*static"
      - name: Log in to the registry
        env:
          TOKEN: ${{ github.token }}
        run: docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin <<< "$TOKEN"
      - name: Build and push the image by digest
        run: |
          docker buildx build --platform "${{ matrix.platform }}" --build-arg VARIANT=production \
            --output "type=image,name=${IMAGE,,},push-by-digest=true,name-canonical=true,push=true" \
            --metadata-file metadata.json .
          jq -re '."containerimage.digest"' metadata.json > "digest-${{ matrix.arch }}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.arch }}
          path: |
            trader-linux-${{ matrix.arch }}
            digest-${{ matrix.arch }}
          if-no-files-found: error

  # The image under the tag for both platforms, and the GitHub release with the binaries and their
  # checksums.
  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          merge-multiple: true
      - name: Log in to the registry
        env:
          TOKEN: ${{ github.token }}
        run: docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin <<< "$TOKEN"
      - name: Name the image for both platforms
        run: |
          image="${IMAGE,,}"
          docker buildx imagetools create --tag "$image:$GITHUB_REF_NAME" \
            "$image@$(cat digest-amd64)" "$image@$(cat digest-arm64)"
          docker buildx imagetools inspect "$image:$GITHUB_REF_NAME"
      - name: Publish the binaries and their checksums
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          chmod +x trader-linux-amd64 trader-linux-arm64
          sha256sum trader-linux-amd64 trader-linux-arm64 > SHA256SUMS
          cat SHA256SUMS
          image="${IMAGE,,}"
          digest="$(docker buildx imagetools inspect "$image:$GITHUB_REF_NAME" --format '{{.Manifest.Digest}}')"
          {
            echo "Static binaries of the trader bot for Linux, built with the production feature, and the image"
            echo "\`$image:$GITHUB_REF_NAME\` (\`$image@$digest\`) for linux/amd64 and linux/arm64."
            echo "Check a download against SHA256SUMS:"
            echo
            echo '```'
            echo "sha256sum --check --ignore-missing SHA256SUMS"
            echo '```'
          } > notes.md
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --notes-file notes.md \
            trader-linux-amd64 trader-linux-arm64 SHA256SUMS
