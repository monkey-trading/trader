[workspace]
resolver = "3"
members = ["crates/trader-core", "crates/trader"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/monkey-trading/trader"

[workspace.dependencies]
trader-core = { path = "crates/trader-core", version = "0.1.0" }

# The engine's crates, pinned to one commit so the bot signs and verifies exactly what that node
# release checks, and verifies its attestation as the engine does. A bump moves all three together
# and names the node releases it supports in the README.
engine-core = { git = "https://github.com/monkey-trading/engine", rev = "ed8f721b0062e48ee944ab063205f3dbccb01ae6", version = "0.1.0" }
engine-verify = { git = "https://github.com/monkey-trading/engine", rev = "ed8f721b0062e48ee944ab063205f3dbccb01ae6", version = "0.1.0" }
engine-wire = { git = "https://github.com/monkey-trading/engine", rev = "ed8f721b0062e48ee944ab063205f3dbccb01ae6", version = "0.1.0" }

# The custody chain: transactions, their signing hashes and encoding, and JSON-RPC over reqwest,
# whose TLS is configured here on ring alone.
alloy-consensus = { version = "2.5", default-features = false, features = ["std"] }
alloy-eips = { version = "2.5", default-features = false, features = ["std"] }
alloy-primitives = { version = "1.7", default-features = false, features = ["std"] }
alloy-rpc-client = { version = "2.5", default-features = false, features = ["reqwest"] }
alloy-rpc-types-eth = { version = "2.5", default-features = false, features = ["std", "serde"] }
# The vault's and the token's bindings, generated from their ABIs at the pinned engine commit.
alloy-sol-types = { version = "1.7", default-features = false, features = ["std", "json"] }
# JSON-RPC errors; the same release as the client.
alloy-transport = { version = "2.5", default-features = false }
anyhow = "1"
# The console's login: one Argon2id hash of the generated password.
argon2 = { version = "0.6", features = ["zeroize"] }
# The console's HTTPS server and WebSocket, and the metrics listener.
axum = { version = "0.8", features = ["ws"] }
bytes = "1"
clap = { version = "4", features = ["derive", "env"] }
# Web3 Secret Storage keystores, the encrypted key files wallets export.
eth-keystore = "0.5"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
hex = "0.4"
http-body-util = "0.1"
humantime-serde = "1"
hyper = { version = "1", features = ["client", "http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio", "server", "service"] }
# The same curve crate engine-core signs with, so a key loads straight into its signing type.
k256 = { version = "0.14.0", default-features = false, features = ["ecdsa"] }
# Prometheus metrics in a registry the process owns, as the engine's node exports its own.
prometheus-client = "0.25"
rand = "0.8"
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }
# The console's self-signed certificate, generated on first run.
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem", "ring"] }
# TLS on ring alone, as the node uses, so no OpenSSL or aws-lc build.
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rustls-webpki = { version = "0.103", default-features = false, features = ["alloc"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
sha2 = "0.11"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "net", "signal"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
# The stream runs over the TLS connection the bot opens itself, so no TLS feature is needed here.
tokio-tungstenite = { version = "0.29", default-features = false, features = ["handshake"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
webpki-roots = "1"
zeroize = "1"

# Tests only: a per-thread counting allocator for the hot path, and scratch files.
allocation-counter = "0.8"
tempfile = "3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
# Money code: an overflow must halt the bot, never wrap silently.
overflow-checks = true

[profile.dev]
opt-level = 2
lto = "thin"
